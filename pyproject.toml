[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctow-guard"
version = "0.2.2"
description = "Governance validation helpers for CTOW (Codex Team Orchestration Workflow)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ctow-guard = "ctow_guard.cli:main"
ctow = "ctow_guard.workflow_cli:main"
ctow-plan = "ctow_guard.workflow_cli:plan_entry"
ctow-start = "ctow_guard.workflow_cli:start_entry"
ctow-status = "ctow_guard.workflow_cli:status_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
